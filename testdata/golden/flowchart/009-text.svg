<text class="node-label" x="127" y="47.6" text-anchor="middle" fill="#1b1f24">[klamrami] i {wąsami}</text>
<text class="node-label" x="127" y="135.6" text-anchor="middle" fill="#1b1f24">„cudzysłów” – półpauza</text>
<text class="node-label" x="127" y="155.6" text-anchor="middle" fill="#1b1f24">§ 7.5.1 &lt;znaczniki&gt; &amp;</text>
<text class="node-label" x="127" y="175.6" text-anchor="middle" fill="#1b1f24">ampersand</text>
<text class="node-label" x="127" y="263.6" text-anchor="middle" fill="#1b1f24">Zażółć gęślą jaźń</text>
<text class="node-label" x="127" y="283.6" text-anchor="middle" fill="#1b1f24">ZAŻÓŁĆ GĘŚLĄ JAŹŃ</text>
<text class="node-label" x="127" y="371.6" text-anchor="middle" fill="#1b1f24">Strzałka w tekście --&gt;</text>
<text class="node-label" x="127" y="391.6" text-anchor="middle" fill="#1b1f24">nie jest krawędzią</text>
<text class="node-label" x="127" y="508.1" text-anchor="middle" fill="#1b1f24">Pytanie; ze</text>
<text class="node-label" x="127" y="528.1" text-anchor="middle" fill="#1b1f24">średnikiem?</text>
<text class="node-label" x="127" y="644.6" text-anchor="middle" fill="#1b1f24">Identyfikator z polskimi</text>
<text class="node-label" x="127" y="664.6" text-anchor="middle" fill="#1b1f24">znakami</text>
