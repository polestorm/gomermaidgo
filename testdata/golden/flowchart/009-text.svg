<text class="node-label" x="113" y="27.6" text-anchor="middle" fill="#1b1f24">Tekst z (nawiasami),</text>
<text class="node-label" x="113" y="47.6" text-anchor="middle" fill="#1b1f24">[klamrami] i {wąsami}</text>
<text class="node-label" x="113" y="155.6" text-anchor="middle" fill="#1b1f24">„cudzysłów” – półpauza</text>
<text class="node-label" x="113" y="175.6" text-anchor="middle" fill="#1b1f24">§ 7.5.1 &lt;znaczniki&gt; &amp;</text>
<text class="node-label" x="113" y="195.6" text-anchor="middle" fill="#1b1f24">ampersand</text>
<text class="node-label" x="113" y="303.6" text-anchor="middle" fill="#1b1f24">Zażółć gęślą jaźń</text>
<text class="node-label" x="113" y="323.6" text-anchor="middle" fill="#1b1f24">ZAŻÓŁĆ GĘŚLĄ JAŹŃ</text>
<text class="node-label" x="113" y="431.6" text-anchor="middle" fill="#1b1f24">Strzałka w tekście --&gt;</text>
<text class="node-label" x="113" y="451.6" text-anchor="middle" fill="#1b1f24">nie jest krawędzią</text>
<text class="node-label" x="113" y="587.6" text-anchor="middle" fill="#1b1f24">Pytanie; ze</text>
<text class="node-label" x="113" y="607.6" text-anchor="middle" fill="#1b1f24">średnikiem?</text>
<text class="node-label" x="113" y="743.6" text-anchor="middle" fill="#1b1f24">Identyfikator z polskimi</text>
<text class="node-label" x="113" y="763.6" text-anchor="middle" fill="#1b1f24">znakami</text>
