<text class="node-label" x="127" y="50.6" text-anchor="middle" fill="#1b1f24">[klamrami] i {wąsami}</text>
<text class="node-label" x="127" y="164.6" text-anchor="middle" fill="#1b1f24">„cudzysłów” – półpauza</text>
<text class="node-label" x="127" y="184.6" text-anchor="middle" fill="#1b1f24">§ 7.5.1 &lt;znaczniki&gt; &amp;</text>
<text class="node-label" x="127" y="204.6" text-anchor="middle" fill="#1b1f24">ampersand</text>
<text class="node-label" x="127" y="318.6" text-anchor="middle" fill="#1b1f24">Zażółć gęślą jaźń</text>
<text class="node-label" x="127" y="338.6" text-anchor="middle" fill="#1b1f24">ZAŻÓŁĆ GĘŚLĄ JAŹŃ</text>
<text class="node-label" x="127" y="452.6" text-anchor="middle" fill="#1b1f24">Strzałka w tekście --&gt;</text>
<text class="node-label" x="127" y="472.6" text-anchor="middle" fill="#1b1f24">nie jest krawędzią</text>
<text class="node-label" x="127" y="612.1" text-anchor="middle" fill="#1b1f24">Pytanie; ze</text>
<text class="node-label" x="127" y="632.1" text-anchor="middle" fill="#1b1f24">średnikiem?</text>
<text class="node-label" x="127" y="771.6" text-anchor="middle" fill="#1b1f24">Identyfikator z polskimi</text>
