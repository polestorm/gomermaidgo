<text class="node-label" x="109" y="45.6" text-anchor="middle" fill="#1b1f24">[klamrami] i {wąsami}</text>
<text class="node-label" x="109" y="133.6" text-anchor="middle" fill="#1b1f24">„cudzysłów” – półpauza</text>
<text class="node-label" x="109" y="153.6" text-anchor="middle" fill="#1b1f24">§ 7.5.1 &lt;znaczniki&gt; &amp;</text>
<text class="node-label" x="109" y="173.6" text-anchor="middle" fill="#1b1f24">ampersand</text>
<text class="node-label" x="109" y="261.6" text-anchor="middle" fill="#1b1f24">Zażółć gęślą jaźń</text>
<text class="node-label" x="109" y="281.6" text-anchor="middle" fill="#1b1f24">ZAŻÓŁĆ GĘŚLĄ JAŹŃ</text>
<text class="node-label" x="109" y="369.6" text-anchor="middle" fill="#1b1f24">Strzałka w tekście --&gt;</text>
<text class="node-label" x="109" y="389.6" text-anchor="middle" fill="#1b1f24">nie jest krawędzią</text>
<text class="node-label" x="109" y="507.6" text-anchor="middle" fill="#1b1f24">Pytanie; ze</text>
<text class="node-label" x="109" y="527.6" text-anchor="middle" fill="#1b1f24">średnikiem?</text>
<text class="node-label" x="109" y="645.6" text-anchor="middle" fill="#1b1f24">Identyfikator z polskimi</text>
