<text class="node-label" x="489.8" y="97.6" font-weight="bold" fill="#1b1f24">Audytor zewnętrzny</text>
<text class="node-label" x="571" y="117.6" text-anchor="middle" fill="#1b1f24">«External Person»</text>
<text class="node-label" x="571" y="137.6" text-anchor="middle" fill="#1b1f24">Przegląda zapisy</text>
<text class="node-label" x="571" y="157.6" text-anchor="middle" fill="#1b1f24">podczas audytu</text>
<text class="cluster-title" x="160.4" y="299.6" text-anchor="middle" fill="#1b1f24">Wytwórca wyrobów medycznych</text>
<text class="cluster-title" x="160.4" y="319.6" text-anchor="middle" fill="#1b1f24">[Enterprise]</text>
<text class="node-label" x="345.6" y="379.6" font-weight="bold" fill="#1b1f24">System jakości</text>
<text class="node-label" x="406" y="399.6" text-anchor="middle" fill="#1b1f24">«System»</text>
<text class="node-label" x="406" y="419.6" text-anchor="middle" fill="#1b1f24">Dokumenty, zapisy,</text>
<text class="node-label" x="406" y="439.6" text-anchor="middle" fill="#1b1f24">szkolenia, działania</text>
<text class="node-label" x="406" y="459.6" text-anchor="middle" fill="#1b1f24">korygujące</text>
<text class="cluster-title" x="111.2" y="631.6" text-anchor="middle" fill="#1b1f24">Infrastruktura</text>
<text class="cluster-title" x="111.2" y="651.6" text-anchor="middle" fill="#1b1f24">[System]</text>
<text class="node-label" x="118.8" y="722.1" font-weight="bold" fill="#1b1f24">Baza danych</text>
